name: tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}, ${{ matrix.stability }}, Redis ${{ matrix.redis }} (${{ matrix.client }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      redis:
        image: redis:${{ matrix.redis }}
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['12', '13']
        stability: [prefer-lowest, prefer-stable]
        redis: ['7']
        client: [phpredis]
        exclude:
          - php: '8.2'
            laravel: '13'
        include:
          - laravel: '12'
            testbench: '10'
          - laravel: '13'
            testbench: '11'
          # The oldest Redis the README claims.
          - php: '8.4'
            laravel: '13'
            testbench: '11'
            stability: prefer-stable
            redis: '6.2'
            client: phpredis
          - php: '8.4'
            laravel: '13'
            testbench: '11'
            stability: prefer-stable
            redis: '7'
            client: predis

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: redis
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:^${{ matrix.laravel }}.0" "orchestra/testbench:^${{ matrix.testbench }}.0" --dev --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/pest --fail-on-skipped
        env:
          REDIS_CLIENT: ${{ matrix.client }}

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: redis
          coverage: none

      - run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  code-style:
    name: Code style
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none

      - run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run Pint
        run: vendor/bin/pint --test

  coverage:
    name: Type, line and mutation coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: redis
          coverage: pcov

      # Type coverage 5.1 calls getCollectedData(), removed in PHPStan 2.3.6.
      - run: composer update --with phpstan/phpstan:2.3.5 --prefer-dist --no-interaction --no-progress

      - name: Type coverage
        run: php -d memory_limit=-1 vendor/bin/pest --type-coverage --min=100 --fail-on-skipped

      - name: Line coverage
        run: vendor/bin/pest --coverage --min=95 --fail-on-skipped

      # Ticket #1604 DEC-10 accepts 89.71%; retain all mutants and require 89.7%.
      - name: Mutation testing (accepted 89.7% floor)
        run: vendor/bin/pest --mutate --min=89.7 --fail-on-skipped
